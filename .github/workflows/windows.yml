name: Windows Studio

on:
  push:
    branches: [develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check and tests including native named pipes
        run: bun run check
      - name: Build development application
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: keyro-studio-windows-x64-dev
          path: build/
          if-no-files-found: error
